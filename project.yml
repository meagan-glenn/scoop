name: GutCheck
options:
  bundleIdPrefix: com.meagan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  GutCheck:
    type: application
    platform: iOS
    sources:
      # Secrets.plist is excluded so the committed xcodeproj never references
      # it; the post-build script bundles it only when present locally.
      - path: GutCheck
        excludes:
          - "Secrets.plist"
    # CloudKit household sync. The container is provisioned by the paid
    # developer account; without one the app runs pure-local (sync stays off).
    # Generated Info.plist keys that have no INFOPLIST_KEY_ build setting.
    # CKSharingSupported is what lets iOS open a CloudKit share link in Scoop.
    info:
      path: GutCheck/Info.plist
      properties:
        CKSharingSupported: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: GutCheck/GutCheck.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.meagan.scoop]
        aps-environment: development
    postBuildScripts:
      - name: Copy Secrets.plist (optional, local only)
        script: |
          if [ -f "$SRCROOT/GutCheck/Secrets.plist" ]; then
            cp "$SRCROOT/GutCheck/Secrets.plist" "$CODESIGNING_FOLDER_PATH/Secrets.plist"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.meagan.scoop
        # Meagan's individual Apple Developer team. Automatic signing registers
        # the App ID, CloudKit container, and profiles on first device build.
        DEVELOPMENT_TEAM: MRV697X79G
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Scoop"
        # HTTPS only; skips the App Store Connect export compliance prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
